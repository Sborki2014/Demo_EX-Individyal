{% extends "base.html" %}

{% block title %}Регистрация — Конференции.РФ{% endblock %}

{% block content %}
<section class="auth-section">
    <article class="auth-card">
        <h1>Регистрация</h1>
        <p class="subtitle">Создайте аккаунт для бронирования помещений</p>

        {% if error %}
            <div class="alert alert-error">{{ error }}</div>
        {% endif %}

        <form method="post" action="/register" class="auth-form">
            <div class="form-group">
                <label for="reg-login">Логин</label>
                <input type="text" id="reg-login" name="login"
                       placeholder="Латиница и цифры, минимум 6 символов"
                       data-testid="reg-login"
                       required minlength="6" pattern="[A-Za-z0-9]+">
            </div>

            <div class="form-group">
                <label for="reg-password">Пароль</label>
                <input type="password" id="reg-password" name="password"
                       placeholder="Минимум 8 символов"
                       data-testid="reg-password"
                       required minlength="8">
            </div>

            <div class="form-group">
                <label for="reg-fullname">ФИО</label>
                <input type="text" id="reg-fullname" name="fullname"
                       placeholder="Иванов Иван Иванович"
                       data-testid="reg-fullname" required>
            </div>

            <div class="form-group">
                <label for="reg-phone">Телефон</label>
                <input type="text" id="reg-phone" name="phone"
                       placeholder="8(999)999-99-99"
                       data-testid="reg-phone"
                       required pattern="8\(\d{3}\)\d{3}-\d{2}-\d{2}">
            </div>

            <div class="form-group">
                <label for="reg-email">Email</label>
                <input type="email" id="reg-email" name="email"
                       placeholder="you@example.com"
                       data-testid="reg-email" required>
            </div>

            <button type="submit" class="btn btn-primary" data-testid="reg-submit">
                Создать пользователя
            </button>
        </form>

        <p class="auth-switch">
            Уже есть аккаунт? <a href="/login">Войти</a>
        </p>
    </article>
</section>
{% endblock %}
