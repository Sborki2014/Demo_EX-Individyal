<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Регистрация</title>
    <link rel="stylesheet" href="/static/style.css">
</head>
<body>
    <main>
        <h1>Регистрация</h1>
        {% if error %}<p style="color:red">{{ error }}</p>{% endif %}
        <form method="post" action="/register">
            <input type="text" name="login" placeholder="Логин" data-testid="reg-login" required>
            <input type="password" name="password" placeholder="Пароль" data-testid="reg-password" required>
            <input type="text" name="fullname" placeholder="ФИО" data-testid="reg-fullname" required>
            <input type="text" name="phone" placeholder="Телефон" data-testid="reg-phone" required>
            <input type="email" name="email" placeholder="Email" data-testid="reg-email" required>
            <button type="submit" data-testid="reg-submit">Создать пользователя</button>
        </form>
        <a href="/login">Еще не зарегистрированы? Регистрация</a>
    </main>
</body>
</html>
