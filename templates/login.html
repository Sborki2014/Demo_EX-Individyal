{% extends "base.html" %}

{% block title %}Вход — Конференции.РФ{% endblock %}

{% block content %}
<section class="auth-section">
    <article class="auth-card">
        <h1>Вход</h1>
        <p class="subtitle">Войдите в личный кабинет</p>

        {% if error %}
            <div class="alert alert-error">{{ error }}</div>
        {% endif %}

        <form method="post" action="/login" class="auth-form">
            <div class="form-group">
                <label for="login-login">Логин</label>
                <input type="text" id="login-login" name="login"
                       placeholder="Ваш логин"
                       data-testid="login-login" required>
            </div>

            <div class="form-group">
                <label for="login-password">Пароль</label>
                <input type="password" id="login-password" name="password"
                       placeholder="Ваш пароль"
                       data-testid="login-password" required>
            </div>

            <button type="submit" class="btn btn-primary" data-testid="login-submit">
                Войти
            </button>
        </form>

        <p class="auth-switch">
            Еще не зарегистрированы? <a href="/register">Регистрация</a>
        </p>
    </article>
</section>
{% endblock %}
