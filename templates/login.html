<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Вход</title>
    <link rel="stylesheet" href="/static/style.css">
</head>
<body>
    <main>
        <h1>Авторизация</h1>
        {% if error %}<p style="color:red">{{ error }}</p>{% endif %}
        <form method="post" action="/login">
            <input type="text" name="login" placeholder="Логин" data-testid="login-login" required>
            <input type="password" name="password" placeholder="Пароль" data-testid="login-password" required>
            <button type="submit" data-testid="login-submit">Войти</button>
        </form>
        <a href="/register">Еще не зарегистрированы? Регистрация</a>
    </main>
</body>
</html>
